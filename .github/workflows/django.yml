name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Show repository structure
      # ------------------------------------------------------------
      - name: Inspect repository
        run: |
          echo "Repository root:"
          pwd

          echo
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | head -200

      # ------------------------------------------------------------
      # 3. Set up Python
      # ------------------------------------------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ------------------------------------------------------------
      # 4. Verify Python installation
      # ------------------------------------------------------------
      - name: Verify Python
        run: |
          python --version
          python -m pip --version

      # ------------------------------------------------------------
      # 5. Locate requirements.txt
      # ------------------------------------------------------------
      - name: Locate dependency file
        id: dependencies
        shell: bash
        run: |
          set -e

          REQUIREMENTS="$(find . -type f -name 'requirements.txt' \
            -not -path './.git/*' \
            | head -n 1)"

          if [ -z "$REQUIREMENTS" ]; then
            echo "ERROR: requirements.txt was not found."
            exit 1
          fi

          REQUIREMENTS_DIR="$(dirname "$REQUIREMENTS")"

          echo "Found requirements.txt:"
          echo "$REQUIREMENTS"

          echo "requirements-file=$REQUIREMENTS" >> "$GITHUB_OUTPUT"
          echo "requirements-dir=$REQUIREMENTS_DIR" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 6. Install dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "${{ steps.dependencies.outputs.requirements-file }}"

      # ------------------------------------------------------------
      # 7. Locate Django manage.py
      # ------------------------------------------------------------
      - name: Locate Django project
        id: django
        shell: bash
        run: |
          set -e

          MANAGE_PY="$(find . -type f -name 'manage.py' \
            -not -path './.git/*' \
            | head -n 1)"

          if [ -z "$MANAGE_PY" ]; then
            echo "ERROR: manage.py was not found anywhere in the repository."
            echo
            echo "Files containing 'manage.py':"
            find . -type f -not -path './.git/*' | sort | head -500
            exit 1
          fi

          DJANGO_DIR="$(dirname "$MANAGE_PY")"

          echo "Found Django entrypoint:"
          echo "$MANAGE_PY"

          echo "Django project directory:"
          echo "$DJANGO_DIR"

          echo "manage-py=$MANAGE_PY" >> "$GITHUB_OUTPUT"
          echo "django-dir=$DJANGO_DIR" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 8. Verify Django installation
      # ------------------------------------------------------------
      - name: Verify Django
        working-directory: ${{ steps.django.outputs.django-dir }}
        run: |
          python -m django --version

      # ------------------------------------------------------------
      # 9. Check Django configuration
      # ------------------------------------------------------------
      - name: Check Django configuration
        working-directory: ${{ steps.django.outputs.django-dir }}
        run: |
          python manage.py check

      # ------------------------------------------------------------
      # 10. Run Django tests
      # ------------------------------------------------------------
      - name: Run Django tests
        working-directory: ${{ steps.django.outputs.django-dir }}
        run: |
          python manage.py test --verbosity=2
